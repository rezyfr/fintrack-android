# Scrolls a sideways chip row until a chip shows, then taps it.
# Env: CHIP. The row is at 71 percent of the screen height.
appId: com.fidriyanto.banktracker
---
- waitForAnimationToEnd
- repeat:
    times: 10
    while:
      notVisible: "${CHIP}"
    commands:
      - swipe:
          start: "90%, 71%"
          end: "15%, 71%"
- tapOn: "${CHIP}"
