# seed: empty
# E2E-008. Pay cycle day 1. The Home range starts on day 1.
appId: com.fidriyanto.banktracker
tags:
  - nightly
---
- runScript:
    file: ../../scripts/js/cycle.js
    env:
      START_DAY: "1"
- launchApp:
    clearState: true
    stopApp: true
- tapOn: "Let us go"
- runFlow:
    file: ../../subflows/setup_storage_server.yaml
- tapOn: "Continue"
- tapOn: "1"
- assertVisible: "Your current cycle: .*"
- tapOn: "Continue"
- tapOn: "Account name"
- inputText: "Cash"
- hideKeyboard
- tapOn: "Add account"
- tapOn: "Continue"
- assertVisible: "Pay cycle starts on day 1"
- tapOn: "Open FinTrack"
- assertVisible: "${output.range}"
