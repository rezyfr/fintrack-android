# seed: base
# E2E-143. A transfer between currencies with no received amount.
appId: com.fidriyanto.banktracker
tags:
  - nightly
---
- runFlow: ../../subflows/launch_clean.yaml
- tapOn:
    id: "add_fab"
- waitForAnimationToEnd
- tapOn: "Transfer"
- tapOn: "0"
- inputText: "10"
- tapOn: "To"
- tapOn: "Euro bank"
- tapOn: "Add description…"
- inputText: "No received"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Enter the amount received."
