# seed: base
# E2E-051. Calendar shows the grid. List returns.
appId: com.fidriyanto.banktracker
tags:
  - nightly
---
- runFlow: ../../subflows/launch_clean.yaml
- runFlow:
    file: ../../subflows/open_tab.yaml
    env:
      TAB: transactions
- tapOn: "Calendar"
- assertNotVisible: "Today"
- assertVisible: "Sun"
- assertVisible: "Sat"
- tapOn: "List"
- assertVisible: "Today"
