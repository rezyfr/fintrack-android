# seed: base
# E2E-069. A paid fixed bill shows Paid.
appId: com.fidriyanto.banktracker
tags:
  - nightly
---
- runFlow: ../../subflows/launch_clean.yaml
- runFlow:
    file: ../../subflows/open_sub.yaml
    env:
      SUB: budget
- runFlow: ../../subflows/scroll_budget.yaml
- assertVisible: "Fixed bills"
- assertVisible: "Paid"
