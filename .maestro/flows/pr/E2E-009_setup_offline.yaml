# seed: empty
# E2E-009. Setup with the data kept on the phone. Home opens, an expense saves, and the app sends
# nothing to the server, although the test build has one built in.
appId: com.fidriyanto.banktracker
tags:
  - pr
---
- launchApp:
    clearState: true
    stopApp: true
- tapOn: "Let us go"
- assertVisible: "Where should FinTrack keep your data?"
- tapOn: "On this phone"
- assertVisible: "Restore a backup file"
- tapOn: "Continue"
- assertNotVisible: "Connect your server"
- tapOn: "Currency code"
- eraseText: 3
- inputText: "USD"
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Account name"
- inputText: "Cash"
- hideKeyboard
- tapOn: "Add account"
- tapOn: "Continue"
- assertVisible: "You are all set"
- tapOn: "Open FinTrack"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
- tapOn:
    id: "add_fab"
- waitForAnimationToEnd
- tapOn: "0"
- inputText: "12500"
- hideKeyboard
- tapOn: "Groceries"
- scrollUntilVisible:
    element: "Add description…"
- tapOn: "Add description…"
- inputText: "Offline lunch"
- hideKeyboard
- scrollUntilVisible:
    element: "Save"
- tapOn: "Save"
- runFlow:
    file: ../../subflows/open_tab.yaml
    env:
      TAB: transactions
- assertVisible: "Offline lunch"
- runFlow:
    file: ../../subflows/assert_request.yaml
    env:
      LOG_METHOD: POST
      LOG_TABLE: transactions
      LOG_EXPECT: none
- runFlow:
    file: ../../subflows/assert_request.yaml
    env:
      LOG_METHOD: POST
      LOG_TABLE: accounts
      LOG_EXPECT: none
