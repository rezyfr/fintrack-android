# seed: base
# adb: set_font_scale.sh 1.3
# after: set_font_scale.sh 1.0
# E2E-153. Font scale 1.3 and a long description. Buttons stay tappable.
appId: com.fidriyanto.banktracker
tags:
  - release
---
- runFlow: ../../subflows/launch_clean.yaml
- tapOn:
    id: "add_fab"
- waitForAnimationToEnd
- tapOn: "0"
- inputText: "15"
- hideKeyboard
- scrollUntilVisible:
    element: "Add description…"
    direction: DOWN
- tapOn: "Add description…"
- inputText: "A very long description to check how the layout copes with a large font"
- hideKeyboard
- tapOn: "Save"
- assertNotVisible: "Category:.*"
