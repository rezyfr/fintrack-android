name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android gates and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The build reads the server address and token from local.properties. The placeholder values are enough to compile.
      - name: Create local.properties
        run: cp local.properties.example local.properties

      # Architecture, colors, strings, Room migrations, web API boundary, compile, and Spotless.
      - name: Contributor gates
        run: bash governance/check_all.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build
